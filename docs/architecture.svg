<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Kenya Retail Market Intelligence Data Platform architecture</title>
  <desc id="desc">Market and point-of-sale data flow through Kafka, Bronze, Silver, Gold, and PostgreSQL warehouse layers. Airflow schedules extraction, POS simulation, cleaning, validation, retries, and backfills.</desc>
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #172554; }
      .subtitle { font: 16px Arial, sans-serif; fill: #475569; }
      .layer { font: 700 16px Arial, sans-serif; fill: #172554; }
      .label { font: 700 15px Arial, sans-serif; fill: #172554; }
      .text { font: 13px Arial, sans-serif; fill: #334155; }
      .small { font: 12px Arial, sans-serif; fill: #475569; }
      .box { stroke-width: 2; rx: 14; ry: 14; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #7c3aed; stroke-width: 2.5; stroke-dasharray: 7 6; fill: none; marker-end: url(#arrowPurple); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" class="title">Kenya Retail Market Intelligence Data Platform</text>
  <text x="700" y="76" text-anchor="middle" class="subtitle">Streaming and batch data pipeline with orchestration, validation, and warehousing</text>

  <rect x="35" y="112" width="1330" height="490" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="65" y="146" class="layer">Data flow</text>

  <rect x="70" y="185" width="200" height="100" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="170" y="220" text-anchor="middle" class="label">Market sources</text>
  <text x="170" y="244" text-anchor="middle" class="text">KAMIS commodity prices</text>
  <text x="170" y="265" text-anchor="middle" class="text">KNBS CPI data</text>

  <rect x="70" y="360" width="200" height="100" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="170" y="395" text-anchor="middle" class="label">Retail sources</text>
  <text x="170" y="419" text-anchor="middle" class="text">Synthetic POS lines</text>
  <text x="170" y="440" text-anchor="middle" class="text">Receipt events</text>

  <rect x="350" y="185" width="210" height="100" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="455" y="220" text-anchor="middle" class="label">Batch ingestion</text>
  <text x="455" y="244" text-anchor="middle" class="text">KAMIS / KNBS downloaders</text>
  <text x="455" y="265" text-anchor="middle" class="text">Synthetic-data generator</text>

  <rect x="350" y="360" width="210" height="100" class="box" fill="#fef3c7" stroke="#d97706"/>
  <text x="455" y="395" text-anchor="middle" class="label">Kafka</text>
  <text x="455" y="419" text-anchor="middle" class="text">POS producer and topics</text>
  <text x="455" y="440" text-anchor="middle" class="text">DLQ for invalid receipts</text>

  <rect x="640" y="270" width="190" height="110" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="735" y="305" text-anchor="middle" class="label">Bronze layer</text>
  <text x="735" y="329" text-anchor="middle" class="text">Raw POS JSONL batches</text>
  <text x="735" y="350" text-anchor="middle" class="small">Bronze writer</text>

  <rect x="910" y="270" width="190" height="110" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="1005" y="305" text-anchor="middle" class="label">Silver layer</text>
  <text x="1005" y="329" text-anchor="middle" class="text">Cleaned Parquet datasets</text>
  <text x="1005" y="350" text-anchor="middle" class="small">Deduplication and validation</text>

  <rect x="1180" y="185" width="150" height="100" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="1255" y="220" text-anchor="middle" class="label">Gold layer</text>
  <text x="1255" y="244" text-anchor="middle" class="text">Sales and market marts</text>
  <text x="1255" y="265" text-anchor="middle" class="small">PySpark transformations</text>

  <rect x="1180" y="390" width="150" height="100" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="1255" y="425" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="1255" y="449" text-anchor="middle" class="text">Star-schema warehouse</text>
  <text x="1255" y="470" text-anchor="middle" class="small">Queries and BI views</text>

  <path d="M270 235 H350" class="line"/>
  <path d="M270 410 H350" class="line"/>
  <path d="M560 410 H640" class="line"/>
  <path d="M735 270 V235 H640" class="line"/>
  <path d="M830 325 H910" class="line"/>
  <path d="M1100 310 H1140 V235 H1180" class="line"/>
  <path d="M1255 285 V390" class="line"/>

  <rect x="35" y="640" width="1330" height="210" rx="20" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="65" y="680" class="layer">Orchestration, quality, and monitoring</text>

  <rect x="85" y="715" width="270" height="90" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="220" y="748" text-anchor="middle" class="label">Apache Airflow</text>
  <text x="220" y="772" text-anchor="middle" class="text">Daily schedules, retries, backfills</text>
  <text x="220" y="793" text-anchor="middle" class="small">Extraction, POS simulation, cleaning DAGs</text>

  <rect x="555" y="715" width="270" height="90" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="690" y="748" text-anchor="middle" class="label">Quality controls</text>
  <text x="690" y="772" text-anchor="middle" class="text">Schema, completeness, format checks</text>
  <text x="690" y="793" text-anchor="middle" class="small">JSON reports; failed checks stop the DAG</text>

  <rect x="1025" y="715" width="270" height="90" class="box" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="1160" y="748" text-anchor="middle" class="label">Operations</text>
  <text x="1160" y="772" text-anchor="middle" class="text">Docker Compose · Airflow UI · Kafka UI</text>
  <text x="1160" y="793" text-anchor="middle" class="small">Logs, DAG state, task retries, streaming topics</text>

  <path d="M220 715 V530 H455 V285" class="dash"/>
  <path d="M220 715 V570 H735 V380" class="dash"/>
  <path d="M690 715 V640 H1005 V380" class="dash"/>
  <path d="M1160 715 V640 H1255 V490" class="dash"/>
</svg>
