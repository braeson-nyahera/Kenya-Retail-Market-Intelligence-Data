x-airflow-common: &airflow-common
  image: apache/airflow:3.3.1-python3.10
  profiles: ["airflow"]
  # Keep Airflow's named user (required by Airflow 3) and share the local
  # developer group so generated data can be written to the bind mount.
  user: "${AIRFLOW_UID:-50000}:${AIRFLOW_GID:-1000}"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://retail_user:retail_password@postgres:5432/kenya_market_db
    AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY:-}"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.session
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    PROJECT_ROOT: /opt/project
    # The first path is Airflow's preinstalled runtime; the project packages are
    # read from the mounted virtual environment and are never installed here.
    PYTHONPATH: /home/airflow/.local/lib/python3.10/site-packages:/opt/project:/opt/project/.venv/lib/python3.10/site-packages
    # PySpark uses the host JDK mounted below; Python packages still come solely
    # from the project's synchronized .venv.
    JAVA_HOME: /opt/java
  volumes:
    - ./:/opt/project
    - ${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}:/opt/java:ro
    - ./dags:/opt/airflow/dags
    - ./src/airflow:/opt/airflow/dags/project
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:

  # --------------------------------------------------------------------------
  # PostgreSQL — Airflow metadata DB + Data Warehouse
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: retail_postgres
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_password
      POSTGRES_DB: kenya_market_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/warehouse/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U retail_user -d kenya_market_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Apache Kafka (KRaft mode) — POS event streaming broker
  # --------------------------------------------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: retail_kafka
    profiles: [ "kafka", "simulation", "producer", "consumer", "airflow" ]
    ports:
      - "9092:9092"
    extra_hosts:
      - "kafka:127.0.0.1"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "/bin/bash -c '</dev/tcp/127.0.0.1/9092' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # Kafka UI — Topic browser at http://localhost:8080
  # --------------------------------------------------------------------------
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: retail_kafka_ui
    profiles: [ "kafka", "ui", "simulation" ]
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  # --------------------------------------------------------------------------
  # POS Simulation — streams 1,000 receipts then exits
  # Runs both producer + bronze consumer together.
  # --------------------------------------------------------------------------
  simulation:
    build: .
    container_name: retail_pos_simulation
    profiles: [ "simulation" ]
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./data:/app/data
    command: [ "uv", "run", "python", "src/pos_simulation/run_all.py", "--limit", "1000", "--delay", "0.01" ]

  # --------------------------------------------------------------------------
  # POS Producer only — streams receipts into Kafka
  # --------------------------------------------------------------------------
  pos-producer:
    build: .
    container_name: retail_pos_producer
    profiles: [ "producer" ]
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./data:/app/data
    command: [ "uv", "run", "python", "src/pos_simulation/pos_producer.py", "--limit", "1000", "--delay", "0.01" ]

  # --------------------------------------------------------------------------
  # Bronze Writer only — consumes Kafka → writes Bronze JSONL
  # --------------------------------------------------------------------------
  bronze-writer:
    build: .
    container_name: retail_bronze_writer
    profiles: [ "consumer" ]
    depends_on:
      - kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./data:/app/data
    command: [ "uv", "run", "python", "src/pos_simulation/bronze_writer.py" ]

  airflow-init:
    <<: *airflow-common
    container_name: retail_airflow_init
    restart: on-failure
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        source /opt/project/.venv/bin/activate &&
        airflow db migrate &&
        (airflow users create
        --username "$${AIRFLOW_ADMIN_USERNAME:-admin}"
        --password "$${AIRFLOW_ADMIN_PASSWORD:-admin}"
        --firstname Admin
        --lastname User
        --role Admin
        --email admin@example.com || true)

  airflow-api-server:
    <<: *airflow-common
    container_name: retail_airflow_api_server
    command: ["bash", "-c", "source /opt/project/.venv/bin/activate && exec airflow api-server"]
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: retail_airflow_dag_processor
    command: ["bash", "-c", "source /opt/project/.venv/bin/activate && exec airflow dag-processor"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: retail_airflow_scheduler
    command: ["bash", "-c", "source /opt/project/.venv/bin/activate && exec airflow scheduler"]
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  kafka_data:
  airflow_logs:
